# CSCI 1953D: Multi-Robot Coordination and Exploration
Spring 2027

## Overview

This course introduces the principles and algorithms that enable teams of robots to work together to explore and map unknown environments. Topics include robot kinematics and sensing, localization, occupancy-grid mapping and SLAM, path planning, frontier-based exploration, consensus, and map merging. Weekly hands-on labs give students practical experience programming mobile robots in simulation and on physical hardware using ROS 2. The course culminates in a team final project in which students design, implement, and evaluate a coordinated multi-robot exploration and mapping system. Students should be both mathematically sophisticated and competent programmers.

**Prerequisites:**  Need to take one course from each of these sets: 
Robotics: (CSCI 1952D, CSCI 1952Z, OR ARTS 1550/ENGN 1550A) AND AI:(CSCI 0410, 1411, 1470, OR 2470)

<script>
  var text = document.getElementById('content').textContent;
  var page = document.getElementById('page');
  page.innerHTML = marked.parse(text, { breaks: true });

  // Use the course title as the browser tab title
  var h1 = page.querySelector('h1');
  if (h1) document.title = h1.textContent;

  // Build the menu automatically from the ## sections
  var nav = document.createElement('nav');
  page.querySelectorAll('h2').forEach(function (h) {
    h.id = h.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    nav.appendChild(a);
  });
  var firstSection = page.querySelector('h2');
  if (firstSection) page.insertBefore(nav, firstSection);
</script>
